spring:
  application:
    name: iot-platform-boot
  datasource:
    url: jdbc:mysql://localhost:3306/iot_alarm_copilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iot:
  mqtt:
    enabled: true
    broker-url: tcp://localhost:1883
    client-id: iot-platform-backend
    inbound-topic: iot/+/telemetry
    qos: 1
  rule:
    enabled: true
    definitions:
      - code: temperature_high
        name: 高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 80
        expression: "temperature != null and temperature >= 80"
      - code: temperature_critical
        name: 超高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 95
        expression: "temperature != null and temperature >= 95"
      - code: humidity_high
        name: 高湿告警规则
        enabled: true
        metric-name: humidity
        threshold: 90
        expression: "humidity != null and humidity >= 90"

