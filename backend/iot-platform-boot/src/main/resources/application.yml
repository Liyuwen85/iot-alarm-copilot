spring:
  application:
    name: iot-platform-boot
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_alarm_copilot
    username: postgres
    password: postgres
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.iotalarmcopilot.access.interfaces.kafka"
        spring.json.value.default.type: "com.example.iotalarmcopilot.access.interfaces.kafka.KafkaTelemetryEnvelope"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iot:
  mqtt:
    enabled: true
    broker-url: tcp://localhost:1883
    client-id: iot-platform-backend
    inbound-topic: iot/+/telemetry
    qos: 1
  kafka:
    enabled: true
    telemetry-topic: iot.telemetry.raw
    consumer-group: iot-platform-access
  timeseries:
    enabled: true
    url: jdbc:postgresql://localhost:5432/iot_telemetry_hot
    username: postgres
    password: postgres
  rule:
    enabled: true
    definitions:
      - code: temperature_high
        name: 高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 80
        expression: "temperature != null and temperature >= 80"
      - code: temperature_critical
        name: 超高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 95
        expression: "temperature != null and temperature >= 95"
      - code: humidity_high
        name: 高湿告警规则
        enabled: true
        metric-name: humidity
        threshold: 90
        expression: "humidity != null and humidity >= 90"

