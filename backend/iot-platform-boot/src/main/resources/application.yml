spring:
  application:
    name: iot-platform-boot
  ai:
    openai:
      api-key: ${MY_OPENAI_API_KEY:}
      base-url: ${MY_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5.4}
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_alarm_copilot
    username: postgres
    password: postgres
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iot:
  ai:
    enabled: true
    model: ${OPENAI_MODEL:gpt-5.4}
    prompt-version: alarm-summary-v1
  command:
    timeout:
      enabled: true
      threshold-seconds: 30
      scan-interval-ms: 5000
  mqtt:
    enabled: false
    broker-url: tcp://localhost:1883
    client-id: iot-platform-backend
    inbound-topic: iot/+/telemetry
    qos: 1
  kafka:
    enabled: true
    telemetry-topic: iot.telemetry.raw
    command-ack-topic: iot.command.ack.raw
    consumer-group: iot-platform-access
    dead-letter-topic: iot.telemetry.raw.dlt
    retry:
      max-retries: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
  timeseries:
    enabled: true
    url: jdbc:postgresql://localhost:5432/iot_telemetry_hot
    username: postgres
    password: postgres
  rule:
    enabled: true
    definitions:
      - code: temperature_high
        name: 高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 80
        expression: "temperature != null and temperature >= 80"
      - code: temperature_critical
        name: 超高温告警规则
        enabled: true
        metric-name: temperature
        threshold: 95
        expression: "temperature != null and temperature >= 95"
      - code: humidity_high
        name: 高湿告警规则
        enabled: true
        metric-name: humidity
        threshold: 90
        expression: "humidity != null and humidity >= 90"
