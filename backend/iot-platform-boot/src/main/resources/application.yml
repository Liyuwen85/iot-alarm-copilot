spring:
  application:
    name: iot-platform-boot
  datasource:
    url: jdbc:mysql://localhost:3306/iot_alarm_copilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

iot:
  mqtt:
    enabled: true
    broker-url: tcp://localhost:1883
    client-id: iot-platform-backend
    inbound-topic: iot/+/telemetry
    qos: 1

