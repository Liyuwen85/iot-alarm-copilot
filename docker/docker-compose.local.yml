services:
  broker:
    image: docker.1ms.run/library/eclipse-mosquitto:2
    container_name: iot_mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - .\mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: docker.1ms.run/apache/kafka:3.8.0
    container_name: iot_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mysql:
    image: docker.1ms.run/library/mysql:8.0
    container_name: iot_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: iot_alarm_copilot
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data-local:/var/lib/mysql

volumes:
  mysql-data-local:
