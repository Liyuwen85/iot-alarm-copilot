services:
  broker:
    image: docker.1ms.run/library/eclipse-mosquitto:2
    container_name: iot_mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - .\mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: docker.1ms.run/apache/kafka:3.8.0
    container_name: iot_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  timescaledb:
    image: docker.1ms.run/timescale/timescaledb:latest-pg16
    container_name: iot_timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iot_alarm_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - .\init\01-create-timeseries-db.sql:/docker-entrypoint-initdb.d/01-create-timeseries-db.sql:ro
      - timescaledb-data-local:/var/lib/postgresql/data

volumes:
  timescaledb-data-local:
